  <rect x="60" y="500" width="1170" height="190" rx="24" fill="url(#baseFill)" stroke="#fb923c" stroke-opacity="0.42" stroke-width="2"/>

  <text x="95" y="286" class="laneTitle" fill="#7dd3fc">LID CELL · INSTANCE 1</text>
  <text x="95" y="536" class="laneTitle" fill="#fdba74">BASE CELL · INSTANCE 2</text>

  <path d="M760 218 C760 242 760 248 760 275" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M950 218 C950 330 950 480 850 525" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 7"/>

