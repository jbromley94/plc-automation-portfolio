  </g>

  <g transform="translate(90 742)" filter="url(#shadow)">
    <rect width="250" height="92" rx="18" fill="#17243a" stroke="#475569"/>
    <circle cx="42" cy="46" r="20" fill="#ef4444"/>
    <rect x="28" y="43" width="28" height="7" rx="3.5" fill="#fff"/>
    <text x="78" y="38" class="nodeTitle">Operator layer</text>
    <text x="78" y="62" class="nodeSub">Auto · Start · Stop · Reset</text>
  </g>
  <path d="M340 788 C490 788 505 205 665 177" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrowGreen)" opacity="0.75"/>

  <g transform="translate(455 742)">
