    </g>
    <text x="85" y="27" text-anchor="middle" class="nodeTitle">Raw conveyor</text>
  </g>
  <g transform="translate(485 316)" filter="url(#shadow)">
    <rect width="90" height="70" rx="15" fill="#10243a" stroke="#38bdf8"/>
    <circle cx="27" cy="35" r="9" fill="#38bdf8"/>
    <path d="M36 35 H66" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="45" y="61" text-anchor="middle" class="tiny">ENTRY PE</text>
  </g>
