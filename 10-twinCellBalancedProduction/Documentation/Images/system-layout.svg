    <circle cx="29" cy="41" r="14" fill="#3b82f6"/>
    <circle cx="47" cy="33" r="9" fill="#60a5fa"/>
    <text x="92" y="34" text-anchor="middle" class="nodeTitle">Emitter</text>
    <text x="92" y="57" text-anchor="middle" class="nodeSub">raw blank</text>
