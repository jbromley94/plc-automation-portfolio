    <path d="M39 70 L39 48 L56 37 L64 48" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="37" r="6" fill="#38bdf8"/>
    <text x="164" y="48" text-anchor="middle" class="nodeTitle">Machining centre</text>
    <text x="164" y="73" text-anchor="middle" class="nodeSub">product select = LID</text>
    <text x="164" y="95" text-anchor="middle" class="tiny">FEED · PICKUP · PROCESS</text>
  </g>
  <g transform="translate(910 316)" filter="url(#shadow)">
    <rect width="90" height="70" rx="15" fill="#10243a" stroke="#38bdf8"/>
    <circle cx="27" cy="35" r="9" fill="#38bdf8"/>
    <path d="M36 35 H66" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="45" y="61" text-anchor="middle" class="tiny">EXIT PE</text>
  </g>
  <g transform="translate(1040 310)" filter="url(#shadow)">
    <rect width="160" height="82" rx="15" fill="#10243a" stroke="#38bdf8"/>
    <path d="M22 49 H138" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0f172a" stroke="#7dd3fc"><circle cx="39" cy="49" r="7"/><circle cx="70" cy="49" r="7"/><circle cx="101" cy="49" r="7"/><circle cx="132" cy="49" r="7"/></g>
    <text x="80" y="27" text-anchor="middle" class="nodeTitle">Exit stages</text>
  </g>

  <path d="M235 351 H270" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M445 351 H480" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M575 351 H610" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M870 351 H905" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1000 351 H1035" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <g transform="translate(100 560)" filter="url(#shadow)">
    <rect width="135" height="82" rx="15" fill="#291b13" stroke="#fb923c"/>
    <circle cx="29" cy="41" r="14" fill="#2563eb"/>
    <circle cx="47" cy="33" r="9" fill="#60a5fa"/>
    <text x="92" y="34" text-anchor="middle" class="nodeTitle">Emitter</text>
    <text x="92" y="57" text-anchor="middle" class="nodeSub">raw blank</text>
  </g>
  <g transform="translate(275 560)" filter="url(#shadow)">
