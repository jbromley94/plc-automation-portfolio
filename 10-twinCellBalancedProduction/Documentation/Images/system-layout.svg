    <path d="M25 49 H145" stroke="#fdba74" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0f172a" stroke="#fdba74"><circle cx="37" cy="49" r="7"/><circle cx="67" cy="49" r="7"/><circle cx="97" cy="49" r="7"/><circle cx="127" cy="49" r="7"/></g>
    <text x="85" y="27" text-anchor="middle" class="nodeTitle">Raw conveyor</text>
  </g>
  <g transform="translate(485 566)" filter="url(#shadow)">
    <rect width="90" height="70" rx="15" fill="#302016" stroke="#fb923c"/>
    <circle cx="27" cy="35" r="9" fill="#fb923c"/>
    <path d="M36 35 H66" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="45" y="61" text-anchor="middle" class="tiny">ENTRY PE</text>
  </g>
  <g transform="translate(615 544)" filter="url(#shadow)">
    <rect width="255" height="114" rx="17" fill="#302016" stroke="#fb923c" stroke-width="2"/>
    <rect x="22" y="24" width="52" height="62" rx="8" fill="#07111f" stroke="#64748b"/>
    <path d="M39 70 L39 48 L56 37 L64 48" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="37" r="6" fill="#fb923c"/>
    <text x="164" y="48" text-anchor="middle" class="nodeTitle">Machining centre</text>
    <text x="164" y="73" text-anchor="middle" class="nodeSub">product select = BASE</text>
    <text x="164" y="95" text-anchor="middle" class="tiny">FEED · PICKUP · PROCESS</text>
  </g>
  <g transform="translate(910 566)" filter="url(#shadow)">
    <rect width="90" height="70" rx="15" fill="#302016" stroke="#fb923c"/>
    <circle cx="27" cy="35" r="9" fill="#fb923c"/>
    <path d="M36 35 H66" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="45" y="61" text-anchor="middle" class="tiny">EXIT PE</text>
  </g>
  <g transform="translate(1040 560)" filter="url(#shadow)">
    <rect width="160" height="82" rx="15" fill="#302016" stroke="#fb923c"/>
    <path d="M22 49 H138" stroke="#fdba74" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0f172a" stroke="#fdba74"><circle cx="39" cy="49" r="7"/><circle cx="70" cy="49" r="7"/><circle cx="101" cy="49" r="7"/><circle cx="132" cy="49" r="7"/></g>
    <text x="80" y="27" text-anchor="middle" class="nodeTitle">Exit stages</text>
  </g>

  <path d="M235 601 H270" stroke="#fb923c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M445 601 H480" stroke="#fb923c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M575 601 H610" stroke="#fb923c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M870 601 H905" stroke="#fb923c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M1000 601 H1035" stroke="#fb923c" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <g filter="url(#shadow)">
    <path d="M1200 351 C1250 351 1258 402 1290 430" fill="none" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M1200 601 C1250 601 1258 532 1290 505" fill="none" stroke="#fb923c" stroke-width="5" marker-end="url(#arrowOrange)"/>
    <rect x="1295" y="390" width="190" height="155" rx="25" fill="#123020" stroke="#4ade80" stroke-width="2"/>
    <path d="M1340 438 H1440 M1340 470 H1440 M1340 502 H1440" stroke="#4ade80" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round"/>
    <text x="1390" y="422" text-anchor="middle" class="nodeTitle">Timed merge</text>
    <text x="1390" y="532" text-anchor="middle" class="tiny">BOTH READY · 2 s</text>
  </g>

  <path d="M1485 468 H1520" stroke="#4ade80" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <g transform="translate(1525 421)" filter="url(#shadow)">
