  </g>
  <g transform="translate(1355 742)">
    <rect width="445" height="92" rx="18" fill="#111d30" stroke="#334155"/>
    <text x="24" y="34" class="tiny">CONTROLLED STOP</text>
    <text x="24" y="62" class="metric">Finish pair → clear beam → 2 s</text>
