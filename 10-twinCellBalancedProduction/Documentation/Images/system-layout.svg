<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900" role="img" aria-labelledby="title desc">
  <title id="title">Twin-Cell Balanced Production control-flow schematic</title>
  <desc id="desc">Parallel lid and base lanes feed two machining centres. A pair coordinator holds matched requests and completions before both lanes merge onto a common outfeed, final sensor and remover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="lidFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123859"/>
      <stop offset="1" stop-color="#0d263f"/>
    </linearGradient>
    <linearGradient id="baseFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57301d"/>
      <stop offset="1" stop-color="#332116"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .badge { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; letter-spacing: 1px; }
      .laneTitle { font: 800 18px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; }
      .nodeTitle { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .nodeSub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .tiny { font: 700 11px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1px; }
      .metric { font: 800 22px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1900" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1900" height="900" rx="28" fill="url(#grid)"/>

  <text x="70" y="76" class="title">Twin-Cell Balanced Production</text>
  <text x="72" y="112" class="subtitle">One held request · two reusable cell instances · one matched lid/base pair</text>

  <g transform="translate(1365 46)">
    <rect width="145" height="38" rx="19" fill="#17243a" stroke="#334155"/>
    <text x="72.5" y="24" text-anchor="middle" class="badge">CODESYS ST</text>
    <rect x="158" width="130" height="38" rx="19" fill="#17243a" stroke="#334155"/>
    <text x="223" y="24" text-anchor="middle" class="badge">OPC DA</text>
    <rect x="301" width="165" height="38" rx="19" fill="#17243a" stroke="#334155"/>
    <text x="383.5" y="24" text-anchor="middle" class="badge">FACTORY I/O</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="130" width="380" height="88" rx="18" fill="#17243a" stroke="#64748b" stroke-width="2"/>
    <circle cx="705" cy="174" r="17" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80"/>
    <path d="M697 174 l6 6 11-14" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="738" y="166" class="nodeTitle">FB_PairCoordinator</text>
    <text x="738" y="190" class="nodeSub">Paired Request / Done</text>
