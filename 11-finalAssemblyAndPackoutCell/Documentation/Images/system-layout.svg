<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900" role="img" aria-labelledby="title desc">
  <title id="title">Assembly and Packout Cell control-flow schematic</title>
  <desc id="desc">Parallel lid and base conveyors feed clamped assembly positions. An X and Z pick-and-place transfers the lid onto the base before the product exits through a leaving sensor, counter and remover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#121c31"/>
    </linearGradient>
    <linearGradient id="lidLane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#113653"/>
      <stop offset="1" stop-color="#0d263d"/>
    </linearGradient>
    <linearGradient id="baseLane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59311d"/>
      <stop offset="1" stop-color="#322116"/>
    </linearGradient>
    <linearGradient id="cellFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173457"/>
      <stop offset="1" stop-color="#171e36"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#fb923c"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font: 700 46px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .badge { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; letter-spacing: 1px; }
      .laneTitle { font: 800 18px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 2px; }
      .nodeTitle { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .nodeSub { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .tiny { font: 700 11px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1px; }
      .metric { font: 800 22px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1900" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1900" height="900" rx="28" fill="url(#grid)"/>

  <text x="70" y="76" class="title">Assembly and Packout Cell</text>
  <text x="72" y="112" class="subtitle">Two material streams · feedback-qualified X/Z transfer · one counted outfeed</text>

  <g transform="translate(1365 46)">
    <rect width="145" height="38" rx="19" fill="#17243a" stroke="#334155"/>
    <text x="72.5" y="24" text-anchor="middle" class="badge">CODESYS ST</text>
    <rect x="158" width="130" height="38" rx="19" fill="#17243a" stroke="#334155"/>
    <text x="223" y="24" text-anchor="middle" class="badge">OPC DA</text>
    <rect x="301" width="165" height="38" rx="19" fill="#17243a" stroke="#334155"/>
    <text x="383.5" y="24" text-anchor="middle" class="badge">FACTORY I/O</text>
  </g>

  <rect x="55" y="180" width="730" height="220" rx="24" fill="url(#lidLane)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="55" y="450" width="730" height="220" rx="24" fill="url(#baseLane)" stroke="#fb923c" stroke-opacity="0.55" stroke-width="2"/>
  <text x="90" y="218" class="laneTitle" fill="#7dd3fc">LID INFEED</text>
  <text x="90" y="488" class="laneTitle" fill="#fdba74">BASE INFEED</text>

  <g transform="translate(90 260)" filter="url(#shadow)">
    <rect width="130" height="82" rx="15" fill="#0b1d30" stroke="#38bdf8"/>
    <circle cx="29" cy="41" r="14" fill="#3b82f6"/>
    <circle cx="47" cy="33" r="9" fill="#4ade80"/>
    <text x="90" y="34" text-anchor="middle" class="nodeTitle">Emitter</text>
    <text x="90" y="57" text-anchor="middle" class="nodeSub">blue / green</text>
  </g>
  <g transform="translate(265 260)" filter="url(#shadow)">
    <rect width="170" height="82" rx="15" fill="#10243a" stroke="#38bdf8"/>
    <path d="M24 51H146" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0f172a" stroke="#7dd3fc">
      <circle cx="39" cy="51" r="7"/><circle cx="70" cy="51" r="7"/><circle cx="101" cy="51" r="7"/><circle cx="132" cy="51" r="7"/>
    </g>
    <text x="85" y="28" text-anchor="middle" class="nodeTitle">Lid conveyor</text>
  </g>
  <g transform="translate(480 247)" filter="url(#shadow)">
    <rect width="265" height="108" rx="17" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="36" cy="45" r="10" fill="#38bdf8"/>
    <path d="M47 45H82" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M31 76H83M42 67V86M72 67V86" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <text x="174" y="38" text-anchor="middle" class="nodeTitle">At place + clamp</text>
    <text x="174" y="64" text-anchor="middle" class="nodeSub">presence and clamp proof</text>
    <text x="174" y="88" text-anchor="middle" class="tiny">LID HELD FOR PICKUP</text>
  </g>
  <path d="M220 301H260" stroke="#38bdf8" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M435 301H475" stroke="#38bdf8" stroke-width="4" marker-end="url(#blueArrow)"/>

  <g transform="translate(90 530)" filter="url(#shadow)">
    <rect width="130" height="82" rx="15" fill="#291b13" stroke="#fb923c"/>
    <circle cx="29" cy="41" r="14" fill="#3b82f6"/>
    <circle cx="47" cy="33" r="9" fill="#4ade80"/>
    <text x="90" y="34" text-anchor="middle" class="nodeTitle">Emitter</text>
    <text x="90" y="57" text-anchor="middle" class="nodeSub">blue / green</text>
  </g>
  <g transform="translate(265 530)" filter="url(#shadow)">
    <rect width="170" height="82" rx="15" fill="#302016" stroke="#fb923c"/>
    <path d="M24 51H146" stroke="#fdba74" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0f172a" stroke="#fdba74">
      <circle cx="39" cy="51" r="7"/><circle cx="70" cy="51" r="7"/><circle cx="101" cy="51" r="7"/><circle cx="132" cy="51" r="7"/>
    </g>
    <text x="85" y="28" text-anchor="middle" class="nodeTitle">Base conveyor</text>
  </g>
  <g transform="translate(480 517)" filter="url(#shadow)">
    <rect width="265" height="108" rx="17" fill="#302016" stroke="#fb923c" stroke-width="2"/>
    <circle cx="36" cy="45" r="10" fill="#fb923c"/>
    <path d="M47 45H82" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M31 76H83M42 67V86M72 67V86" stroke="#fdba74" stroke-width="4" stroke-linecap="round"/>
    <text x="174" y="38" text-anchor="middle" class="nodeTitle">At place + clamp</text>
    <text x="174" y="64" text-anchor="middle" class="nodeSub">presence and clamp proof</text>
    <text x="174" y="88" text-anchor="middle" class="tiny">BASE HELD FOR ASSEMBLY</text>
  </g>
  <path d="M220 571H260" stroke="#fb923c" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <path d="M435 571H475" stroke="#fb923c" stroke-width="4" marker-end="url(#orangeArrow)"/>

  <g filter="url(#shadow)">
    <rect x="845" y="220" width="380" height="385" rx="28" fill="url(#cellFill)" stroke="#a78bfa" stroke-width="2"/>
    <text x="885" y="262" class="laneTitle" fill="#c4b5fd">X/Z PICK-AND-PLACE</text>
    <path d="M925 320H1135V500" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <rect x="1000" y="300" width="88" height="56" rx="12" fill="#111827" stroke="#a78bfa"/>
    <path d="M1044 356V425" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
    <path d="M1025 425H1063L1073 454H1015Z" fill="#0b1527" stroke="#4ade80" stroke-width="3"/>
    <circle cx="1026" cy="450" r="7" fill="#38bdf8"/>
    <circle cx="1062" cy="450" r="7" fill="#fb923c"/>
    <path d="M949 386H1121" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#greenArrow)"/>
    <text x="1035" y="493" text-anchor="middle" class="nodeTitle">Grip · transfer · place</text>
    <text x="1035" y="519" text-anchor="middle" class="nodeSub">motion observed TRUE → FALSE</text>
    <g transform="translate(890 548)">
      <rect width="86" height="32" rx="16" fill="#14233b" stroke="#475569"/>
      <text x="43" y="21" text-anchor="middle" class="tiny">PICK</text>
      <rect x="102" width="86" height="32" rx="16" fill="#14233b" stroke="#475569"/>
      <text x="145" y="21" text-anchor="middle" class="tiny">TRANSFER</text>
      <rect x="204" width="86" height="32" rx="16" fill="#14233b" stroke="#475569"/>
      <text x="247" y="21" text-anchor="middle" class="tiny">PLACE</text>
    </g>
  </g>

  <path d="M745 301C800 301 805 330 842 350" fill="none" stroke="#38bdf8" stroke-width="5" marker-end="url(#blueArrow)"/>
  <path d="M745 571C800 571 805 520 842 500" fill="none" stroke="#fb923c" stroke-width="5" marker-end="url(#orangeArrow)"/>

  <g transform="translate(1270 470)" filter="url(#shadow)">
    <rect width="175" height="122" rx="18" fill="#123020" stroke="#4ade80" stroke-width="2"/>
    <path d="M30 71H145" stroke="#86efac" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 87V55M133 87V55" stroke="#4ade80" stroke-width="4"/>
    <text x="87.5" y="32" text-anchor="middle" class="nodeTitle">Base positioner</text>
    <text x="87.5" y="109" text-anchor="middle" class="tiny">RELEASE + RAISE</text>
  </g>
  <path d="M1225 531H1265" stroke="#4ade80" stroke-width="5" marker-end="url(#greenArrow)"/>

  <g transform="translate(1490 470)" filter="url(#shadow)">
    <rect width="150" height="122" rx="18" fill="#123020" stroke="#4ade80"/>
    <circle cx="36" cy="52" r="11" fill="#4ade80"/>
    <path d="M48 52H111" stroke="#f8fafc" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="75" y="88" text-anchor="middle" class="nodeTitle">Part leaving</text>
    <text x="75" y="108" text-anchor="middle" class="tiny">RISING EDGE</text>
  </g>
  <path d="M1445 531H1485" stroke="#4ade80" stroke-width="5" marker-end="url(#greenArrow)"/>

  <g transform="translate(1685 450)" filter="url(#shadow)">
    <rect width="165" height="162" rx="20" fill="#123020" stroke="#4ade80"/>
    <rect x="28" y="27" width="109" height="48" rx="10" fill="#07111f" stroke="#86efac"/>
    <text x="82.5" y="60" text-anchor="middle" class="metric">+1</text>
    <path d="M52 98H113L126 130H39Z" fill="#07111f" stroke="#86efac" stroke-width="3"/>
    <text x="82.5" y="151" text-anchor="middle" class="tiny">COUNT + REMOVE</text>
  </g>
  <path d="M1640 531H1680" stroke="#4ade80" stroke-width="5" marker-end="url(#greenArrow)"/>

  <g transform="translate(72 740)" filter="url(#shadow)">
    <rect width="255" height="92" rx="18" fill="#17243a" stroke="#475569"/>
    <circle cx="42" cy="46" r="20" fill="#ef4444"/>
    <rect x="28" y="43" width="28" height="7" rx="3.5" fill="#fff"/>
    <text x="78" y="38" class="nodeTitle">Operator layer</text>
    <text x="78" y="62" class="nodeSub">Auto · Start · Stop · Reset</text>
  </g>
  <path d="M327 786C520 786 681 715 845 568" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#greenArrow)" opacity="0.8"/>

  <g transform="translate(380 740)">
    <rect width="280" height="92" rx="18" fill="#111d30" stroke="#334155"/>
    <text x="24" y="34" class="tiny">SEQUENCE</text>
    <text x="24" y="64" class="metric">16 enum states</text>
  </g>
  <g transform="translate(690 740)">
    <rect width="260" height="92" rx="18" fill="#111d30" stroke="#334155"/>
    <text x="24" y="34" class="tiny">OPC BOUNDARY</text>
    <text x="24" y="64" class="metric">40 mapped items</text>
  </g>
  <g transform="translate(980 740)">
    <rect width="245" height="92" rx="18" fill="#111d30" stroke="#334155"/>
    <text x="24" y="34" class="tiny">PLC TASK</text>
    <text x="24" y="64" class="metric">20 ms cyclic</text>
  </g>
  <g transform="translate(1255 740)">
    <rect width="545" height="92" rx="18" fill="#111d30" stroke="#334155"/>
    <text x="24" y="34" class="tiny">ASSEMBLY HANDSHAKE</text>
    <text x="24" y="64" class="metric">Feed → clamp → grip → move → release → count</text>
  </g>

  <text x="1800" y="870" text-anchor="end" class="nodeSub">Control-flow schematic derived from the supplied CODESYS and Factory I/O exports</text>
</svg>
